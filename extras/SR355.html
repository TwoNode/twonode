<!-- ArcGIS JS API -->
<link
  rel="stylesheet"
  href="https://js.arcgis.com/4.29/esri/themes/light/main.css"
/>
<!-- Add this script to load the ArcGIS API -->
<script src="https://js.arcgis.com/4.29/"></script>

<!-- Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCzhhoV6YJZc640ODPgDoz9dKTSXnYr0Gw&libraries=places"></script>

<div class="search-panel">
  <div class="search-header">
    <h3>Spatial Record Search</h3>
  </div>

  <div class="search-sections">
    <div class="search-grid">
      <!-- Field Search -->
      <div class="search-item">
        <label for="searchField" class="search-label">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
            ></path>
          </svg>
          Select Field
        </label>
        <select id="searchField" class="search-input"></select>
      </div>

      <!-- Search Text -->
      <div class="search-item">
        <label for="fieldSearch" class="search-label">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          Search Text
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="fieldSearch"
            placeholder="Enter search text..."
            class="search-input"
          />
          <div class="input-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="search-item">
        <label for="searchResults" class="search-label">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
          Results
        </label>
        <select id="searchResults" class="search-input"></select>
      </div>

      <!-- UTM Coordinate -->
      <div class="search-item">
        <label for="utmCoord" class="search-label">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
          Locate by UTM
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="utmCoord"
            placeholder="e.g., 542520.253,724085.335"
            class="search-input"
          />
          <div class="input-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Address Search -->
      <div class="search-item">
        <label for="addressInput" class="search-label">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
            ></path>
          </svg>
          Search Address
        </label>
        <div class="input-wrapper">
          <input
            id="addressInput"
            type="text"
            placeholder="Enter address..."
            class="search-input"
          />
          <div class="input-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Locate Button -->
      <div class="search-item button-item">
        <button onclick="window?.goToUTM()" class="search-button">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            class="button-icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            ></path>
          </svg>
          Locate Coordinate
        </button>
      </div>
    </div>
  </div>

  <style>
    #viewDiv {
      height: 100%;
      width: 100%;
      min-height: 80vh;
      margin: 0;
      padding: 0;
      border: 8px solid blue;
    }

    .search-panel {
      width: 100%;
      margin: 0;
      padding: 16px 0 16px 0;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border: 1px solid #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      background: #fff;
    }

    .search-header {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .search-header h3 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-header h3::before {
      content: "";
      width: 4px;
      height: 20px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 2px;
    }

    .search-sections {
      width: 100%;
      padding: 0 24px 0 24px;
    }

    .search-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .search-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      transition: all 0.2s ease;
    }

    .search-item:hover {
      border-color: #d1d5db;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .button-item {
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .search-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }

    .search-icon {
      width: 16px;
      height: 16px;
      color: #6b7280;
    }

    .input-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      padding-right: 40px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.875rem;
      background: #fff;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .input-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    .input-icon svg {
      width: 16px;
      height: 16px;
    }

    .search-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .search-button:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .button-icon {
      width: 16px;
      height: 16px;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .search-panel {
        width: 100%;
        margin: 0;
        padding: 8px 0 8px 0;
      }
      .search-sections {
        padding: 0 8px 0 8px;
      }
      .search-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .search-item {
        padding: 12px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .search-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1025px) {
      .search-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</div>

<div id="viewDiv"></div>

<script type="module">
  // Import ArcGIS modules
  import WebMap from "https://js.arcgis.com/4.29/@arcgis/core/WebMap.js";
  import MapView from "https://js.arcgis.com/4.29/@arcgis/core/views/MapView.js";
  import FeatureLayer from "https://js.arcgis.com/4.29/@arcgis/core/layers/FeatureLayer.js";
  import Graphic from "https://js.arcgis.com/4.29/@arcgis/core/Graphic.js";
  import GraphicsLayer from "https://js.arcgis.com/4.29/@arcgis/core/layers/GraphicsLayer.js";
  import Query from "https://js.arcgis.com/4.29/@arcgis/core/rest/support/Query.js";
  import Legend from "https://js.arcgis.com/4.29/@arcgis/core/widgets/Legend.js";
  import LayerList from "https://js.arcgis.com/4.29/@arcgis/core/widgets/LayerList.js";
  import Expand from "https://js.arcgis.com/4.29/@arcgis/core/widgets/Expand.js";
  import Point from "https://js.arcgis.com/4.29/@arcgis/core/geometry/Point.js";
  // Replace the projection import line with:
  import * as projection from "https://js.arcgis.com/4.29/@arcgis/core/geometry/projection.js";
  import SpatialReference from "https://js.arcgis.com/4.29/@arcgis/core/geometry/SpatialReference.js";

  // Initialize the webmap
  const webmap = new WebMap({
    portalItem: { id: "9f45cec473534d49a1d56633b8516609" },
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap,
  });

  const graphicsLayer = new GraphicsLayer({
    title: "Search point",
    listMode: "show",
  });
  view.map.add(graphicsLayer);

  let layer;
  webmap.when(() => {
    view.map.reorder(graphicsLayer, view.map.layers.length - 1);
    layer = webmap.layers.find((l) => l.title === "SpatialRecords");

    if (!layer) {
      console.error("SpatialRecords layer not found in the webmap.");
      return;
    }

    layer.load().then(() => {
      const searchFieldSelect = document.getElementById("searchField");
      const fields = layer.fields.filter((f) => f.type === "string");
      fields.forEach((field) => {
        const opt = document.createElement("option");
        opt.value = field.name;
        opt.textContent = field.alias || field.name;
        searchFieldSelect.appendChild(opt);
      });
    });
  });

  // Add UI components
  const legendExpand = new Expand({
    view,
    content: new Legend({ view }),
    expanded: false,
  });

  const layerListExpand = new Expand({
    view,
    content: new LayerList({ view }),
    expanded: false,
  });

  view.ui.add(legendExpand, "bottom-left");
  view.ui.add(layerListExpand, "top-right");

  // Setup search functionality
  const searchFieldSelect = document.getElementById("searchField");
  const fieldSearch = document.getElementById("fieldSearch");
  const resultSelect = document.getElementById("searchResults");

  fieldSearch.addEventListener("input", async () => {
    if (!layer) return;

    const field = searchFieldSelect.value;
    const text = fieldSearch.value.trim();
    if (text.length < 2 || !field) return;

    const query = layer.createQuery();
    query.where = `${field} LIKE '%${text}%'`;
    query.outFields = [field];
    query.returnGeometry = false;

    const results = await layer.queryFeatures(query);
    resultSelect.innerHTML = "";
    results.features.forEach((f) => {
      const opt = document.createElement("option");
      opt.value = f.attributes[field];
      opt.textContent = f.attributes[field];
      resultSelect.appendChild(opt);
    });
  });

  // Make goToUTM available globally
  window.goToUTM = async () => {
    try {
      const coordInput = document.getElementById("utmCoord");
      if (!coordInput) return;

      const coordValue = coordInput.value.trim();
      const parts = coordValue.split(",");
      if (parts.length !== 2) {
        alert("Enter coordinate in X,Y format (e.g., 542520.253,724085.335)");
        return;
      }

      const x = parseFloat(parts[0]);
      const y = parseFloat(parts[1]);
      if (isNaN(x) || isNaN(y)) {
        alert("Coordinates must be valid numbers.");
        return;
      }

      const utmPoint = new Point({
        x: x,
        y: y,
        spatialReference: new SpatialReference({ wkid: 26331 }),
      });

      await projection.load();
      const projected = projection.project(utmPoint, view.spatialReference);
      if (!projected) return;

      graphicsLayer.removeAll();
      graphicsLayer.add(
        new Graphic({
          geometry: projected,
          symbol: {
            type: "simple-marker",
            color: "red",
            size: "10px",
          },
        })
      );

      await view.goTo({ target: projected, zoom: 20 });
      checkIntersection(projected);
    } catch (error) {
      console.error("Error in goToUTM:", error);
      alert("Error processing UTM coordinates");
    }
  };

  // Add Google Maps Places Autocomplete
  const input = document.getElementById("addressInput");
  if (!input) {
    console.error("Address input element not found");
  } else {
    const autocomplete = new google.maps.places.Autocomplete(input);
    autocomplete.addListener("place_changed", () => {
      try {
        const place = autocomplete.getPlace();
        if (!place.geometry) return;

        const location = place.geometry.location;
        const point = new Point({
          longitude: location.lng(),
          latitude: location.lat(),
        });

        graphicsLayer.removeAll();
        graphicsLayer.add(
          new Graphic({
            geometry: point,
            symbol: {
              type: "simple-marker",
              color: "green",
              size: "10px",
            },
          })
        );

        view.goTo({ target: point, zoom: 20 });
        checkIntersection(point);
      } catch (error) {
        console.error("Error in place_changed handler:", error);
      }
    });
  }

  function checkIntersection(point) {
    if (!layer || !point) return;

    try {
      const spatialQuery = layer.createQuery();
      spatialQuery.geometry = point;
      spatialQuery.spatialRelationship = "intersects";
      spatialQuery.outFields = ["*"];
      spatialQuery.returnGeometry = true;

      layer
        .queryFeatures(spatialQuery)
        .then((results) => {
          if (results?.features?.length > 0) {
            view.popup.open({
              features: results.features,
              location: point,
            });
          } else {
            view.popup.close();
          }
        })
        .catch((error) => {
          console.error("Error querying features:", error);
        });
    } catch (error) {
      console.error("Error in checkIntersection:", error);
    }
  }

  // Add click handler for the map
  view.on("click", async function (event) {
    try {
      const point = event.mapPoint;
      if (!point) return;

      await projection.load();
      const utm = projection.project(
        point,
        new SpatialReference({ wkid: 26331 })
      );

      const utmCoordInput = document.getElementById("utmCoord");
      if (utmCoordInput && utm) {
        utmCoordInput.value = `${utm.x.toFixed(3)},${utm.y.toFixed(3)}`;
      }

      const lat = point.latitude;
      const lng = point.longitude;
      const geocoder = new google.maps.Geocoder();

      geocoder.geocode({ location: { lat, lng } }, (results, status) => {
        const addressInput = document.getElementById("addressInput");
        if (status === "OK" && results?.[0] && addressInput) {
          addressInput.value = results[0].formatted_address;
        }
      });

      graphicsLayer.removeAll();
      graphicsLayer.add(
        new Graphic({
          geometry: point,
          symbol: {
            type: "simple-marker",
            color: "orange",
            size: "10px",
          },
        })
      );

      await view.goTo({ target: point, zoom: 20 });

      const response = await view.hitTest(event);
      const results = response.results.filter(
        (r) => r.graphic?.layer?.type === "feature"
      );

      if (results.length > 0) {
        const features = results.map((r) => r.graphic);
        view.popup.open({
          features: features,
          location: point,
        });
      } else {
        view.popup.close();
      }
    } catch (error) {
      console.error("Error in click handler:", error);
    }
  });
</script>
