<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parcel & Pillar Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.29/esri/themes/light/main.css"
    />
    <style>
      html,
      body,
      #viewDiv {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      #uploadInput,
      #formContainer {
        position: absolute;
        background: white;
        padding: 12px;
        z-index: 99;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        border-radius: 10px;
      }
      #uploadInput {
        top: 10px;
        left: 10px;
      }
      #formContainer {
        top: 10px;
        right: 10px;
        display: none;
        max-height: 90%;
        overflow-y: auto;
        max-width: 300px;
      }
      label {
        font-weight: bold;
        margin-top: 8px;
        display: block;
      }
      input,
      select,
      button {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
      }
      button {
        margin-top: 10px;
        background: #3366cc;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="uploadInput">
      <label>Select CSV (PillarNumber,Easting,Northing)</label>
      <input type="file" id="csvFile" accept=".csv" />
    </div>

    <div id="formContainer">
      <label>Plan Number:<input type="text" id="planNumberInput" /></label>
      <label>Survey Title:<input type="text" id="surveyTitleInput" /></label>
      <label
        >Plan Type:
        <select id="planTypeInput">
          <option value="">-- Select --</option>
          <option>APPROVED LAYOUT</option>
          <option>DEED</option>
          <option>DEED CHANGE OF TITLE</option>
          <option>DEED CHANGE OF TITLE(LAYOUT)</option>
          <option>PROVISIONAL</option>
          <option>PROVISIONAL LAYOUT</option>
          <option>WITHDRAWAL AND RE-SUBMISSION</option>
        </select>
      </label>
      <div id="referencePlanDiv" class="hidden">
        <label
          >Reference Plan Number:<input type="text" id="referencePlanInput"
        /></label>
      </div>
      <label
        >Pillar Type:
        <select id="pillarTypeInput">
          <option value="">-- Select --</option>
          <option>REGULAR</option>
          <option>SPECIAL</option>
        </select>
      </label>
      <label>Deeded Area:<input type="text" id="deededAreaInput" /></label>
      <label>Facilitator:<input type="text" id="facilitatorInput" /></label>
      <label>WARD:<input type="text" id="wardInput" readonly /></label>
      <label>LCDA:<input type="text" id="lcdaInput" readonly /></label>
      <label>LGA:<input type="text" id="lgaInput" readonly /></label>
      <label
        >Is Certificate Ready?
        <select id="certificateReady">
          <option value="">-- Select --</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </label>
      <label id="evidenceLabel" class="hidden"
        >Upload Evidence:<input type="file"
      /></label>
      <button id="submitAttributes">Submit</button>
    </div>

    <div id="viewDiv"></div>

    <script src="https://js.arcgis.com/4.29/"></script>
    <script>
      require([
        "esri/views/MapView",
        "esri/WebMap",
        "esri/layers/GraphicsLayer",
        "esri/Graphic",
        "esri/geometry/Point",
        "esri/geometry/Polygon",
        "esri/geometry/projection",
        "esri/geometry/SpatialReference",
        "esri/widgets/LayerList",
        "esri/layers/FeatureLayer",
      ], function (
        MapView,
        WebMap,
        GraphicsLayer,
        Graphic,
        Point,
        Polygon,
        projection,
        SpatialReference,
        LayerList,
        FeatureLayer
      ) {
        const graphicsLayer = new GraphicsLayer({ title: "Uploaded Survey" });
        const pointLayer = new GraphicsLayer({
          title: "Uploaded Survey Pillars",
        });

        const webmap = new WebMap({
          portalItem: { id: "5b13e132fb1c403fb19d389b0462af4e" },
        });

        webmap.addMany([graphicsLayer, pointLayer]);

        const view = new MapView({ container: "viewDiv", map: webmap });

        const layerList = new LayerList({ view });
        view.ui.add(layerList, "bottom-left");

        view.when(() => webmap.reorder(graphicsLayer, 2));
        view.when(() => webmap.reorder(pointLayer, 3));

        const form = document.getElementById("formContainer");
        const submitBtn = document.getElementById("submitAttributes");

        const wardInput = document.getElementById("wardInput");
        const lcdaInput = document.getElementById("lcdaInput");
        const lgaInput = document.getElementById("lgaInput");

        const planTypeInput = document.getElementById("planTypeInput");
        const referencePlanDiv = document.getElementById("referencePlanDiv");
        const referencePlanInput =
          document.getElementById("referencePlanInput");

        const certificateSelect = document.getElementById("certificateReady");
        const evidenceLabel = document.getElementById("evidenceLabel");

        let currentGraphic = null;
        let finalPillars = [];

        planTypeInput.addEventListener("change", () => {
          const value = planTypeInput.value;
          const showRef = [
            "DEED CHANGE OF TITLE",
            "DEED CHANGE OF TITLE(LAYOUT)",
            "WITHDRAWAL AND RE-SUBMISSION",
          ].includes(value);
          referencePlanDiv.classList.toggle("hidden", !showRef);
        });

        certificateSelect.addEventListener("change", () => {
          evidenceLabel.classList.toggle(
            "hidden",
            certificateSelect.value !== "yes"
          );
        });

        document
          .getElementById("csvFile")
          .addEventListener("change", async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const text = await file.text();
            const rows = text.trim().split("\n").slice(1);
            const rawPoints = rows.map((row) => {
              const [pillarNumber, easting, northing] = row.split(",");
              return {
                pillarNumber: pillarNumber.trim(),
                x: parseFloat(easting),
                y: parseFloat(northing),
              };
            });

            await projection.load();

            const projectedPoints = rawPoints.map((pt, i) => {
              const original = new Point({
                x: pt.x,
                y: pt.y,
                spatialReference: new SpatialReference({ wkid: 26331 }),
              });
              const projected = projection.project(
                original,
                new SpatialReference({ wkid: 4326 })
              );
              return {
                x: projected.x,
                y: projected.y,
                index: i,
                pillarNumber: pt.pillarNumber,
              };
            });

            finalPillars = projectedPoints;

            const ring = projectedPoints.map((p) => [p.x, p.y]);
            if (ring[0][0] !== ring.at(-1)[0] || ring[0][1] !== ring.at(-1)[1])
              ring.push(ring[0]);

            const polygon = new Polygon({
              rings: [ring],
              spatialReference: { wkid: 4326 },
            });

            const graphic = new Graphic({
              geometry: polygon,
              symbol: {
                type: "simple-fill",
                color: [0, 0, 255, 0.2],
                outline: { color: "red", width: 2 },
              },
            });

            currentGraphic = graphic;
            graphicsLayer.removeAll();
            graphicsLayer.add(graphic);
            pointLayer.removeAll();

            projectedPoints.forEach((p) => {
              const pointGraphic = new Graphic({
                geometry: new Point({ x: p.x, y: p.y }),
                symbol: {
                  type: "simple-marker",
                  color: [0, 102, 255],
                  outline: { color: [255, 0, 0], width: 2 },
                },
                attributes: { pillarNumber: p.pillarNumber },
                popupTemplate: {
                  title: "Pillar",
                  content: "Number: {pillarNumber}",
                },
              });
              pointLayer.add(pointGraphic);
            });

            view.goTo(graphic);
            form.style.display = "block";

            // Sample query to get ward/lga
            const adminLayer = new FeatureLayer({
              url: "https://services8.arcgis.com/u07MVBpj9TT3farW/arcgis/rest/services/LagosStateHealthFacilities/FeatureServer/2",
              outFields: ["WARD", "LCDA", "LGA"],
            });

            const query = adminLayer.createQuery();
            query.geometry = polygon;
            query.spatialRelationship = "intersects";
            query.returnGeometry = false;

            const result = await adminLayer.queryFeatures(query);
            if (result.features.length > 0) {
              const attrs = result.features[0].attributes;
              wardInput.value = attrs.WARD || "N/A";
              lcdaInput.value = attrs.LCDA || "N/A";
              lgaInput.value = attrs.LGA || "N/A";
              graphic.attributes = {
                WARD: attrs.WARD,
                LCDA: attrs.LCDA,
                LGA: attrs.LGA,
              };
            }
          });

        submitBtn.onclick = async () => {
          if (!currentGraphic || finalPillars.length === 0)
            return alert("Missing geometry or pillars.");

          const attributes = {
            PlanNumber: document.getElementById("planNumberInput").value,
            SurveyTitle: document.getElementById("surveyTitleInput").value,
            PlanType: planTypeInput.value,
            ReferencePlanNumber: referencePlanInput.value || "N/A",
            DeededArea: document.getElementById("deededAreaInput").value,
            Facilitator: document.getElementById("facilitatorInput").value,
            PillarType: document.getElementById("pillarTypeInput").value,
            CertificateReady: certificateSelect.value,
            WARD: wardInput.value,
            LCDA: lcdaInput.value,
            LGA: lgaInput.value,
          };

          const geometry = currentGraphic.geometry.toJSON();
          const pillars = finalPillars;

          try {
            const res = await fetch("/submit", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ geometry, attributes, pillars }),
            });

            if (res.ok) alert("Upload successful!");
            else alert("Upload failed.");
          } catch (err) {
            console.error(err);
            alert("Network or server error.");
          }
        };
      });
    </script>
  </body>
</html>
