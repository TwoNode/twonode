<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parcel & Pillar Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #uploadInput,
      #formContainer,
      #layerControl {
        position: absolute;
        background: white;
        padding: 12px;
        z-index: 99;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        font-family: sans-serif;
        font-size: 14px;
      }

      #uploadInput {
        top: 10px;
        left: 10px;
      }
      #formContainer {
        top: 10px;
        right: 10px;
        display: none;
        max-height: 90%;
        overflow-y: auto;
        max-width: 300px;
      }

      #layerControl {
        bottom: 20px;
        left: 20px;
        width: 220px;
      }
      #layerControl strong {
        display: block;
        font-size: 15px;
        margin-bottom: 6px;
        color: #333;
      }
      #layerControl label {
        display: block;
        margin: 4px 0;
        cursor: pointer;
      }
      input[type="radio"],
      input[type="checkbox"] {
        margin-right: 6px;
      }

      label {
        font-weight: bold;
        margin-top: 8px;
        display: block;
      }
      input,
      select,
      button {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
      }
      button {
        margin-top: 10px;
        background: #3366cc;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="uploadInput">
      <label>Select CSV (PillarNumber,Easting,Northing)</label>
      <input type="file" id="csvFile" accept=".csv" />
    </div>

    <div id="layerControl">
      <strong>Basemaps</strong>
      <label><input type="radio" name="basemap" value="osm" /> OSM</label>
      <label
        ><input type="radio" name="basemap" value="satellite" /> Google
        Satellite</label
      >
      <label
        ><input type="radio" name="basemap" value="hybrid" /> Google
        Hybrid</label
      >
      <label
        ><input type="radio" name="basemap" value="terrain" /> Google
        Terrain</label
      >
      <label
        ><input type="radio" name="basemap" value="roadmap" checked /> Google
        Roadmap</label
      >
      <hr />
      <strong>Overlays</strong>
      <label
        ><input type="checkbox" id="polygonToggle" checked /> Uploaded
        Polygon</label
      >
      <label
        ><input type="checkbox" id="pillarToggle" checked /> Pillar
        Points</label
      >
    </div>

    <div id="formContainer">
      <label>Plan Number:<input type="text" id="planNumberInput" /></label>
      <label>Survey Title:<input type="text" id="surveyTitleInput" /></label>
      <label
        >Plan Type:
        <select id="planTypeInput">
          <option value="">-- Select --</option>
          <option>APPROVED LAYOUT</option>
          <option>DEED</option>
          <option>DEED CHANGE OF TITLE</option>
          <option>DEED CHANGE OF TITLE(LAYOUT)</option>
          <option>PROVISIONAL</option>
          <option>PROVISIONAL LAYOUT</option>
          <option>WITHDRAWAL AND RE-SUBMISSION</option>
        </select>
      </label>
      <div id="referencePlanDiv" class="hidden">
        <label
          >Reference Plan Number:<input type="text" id="referencePlanInput"
        /></label>
      </div>
      <label
        >Pillar Type:
        <select id="pillarTypeInput">
          <option value="">-- Select --</option>
          <option>REGULAR</option>
          <option>SPECIAL</option>
        </select>
      </label>
      <label>Deeded Area:<input type="text" id="deededAreaInput" /></label>
      <label>Facilitator:<input type="text" id="facilitatorInput" /></label>
      <label>WARD:<input type="text" id="wardInput" readonly /></label>
      <label>LCDA:<input type="text" id="lcdaInput" readonly /></label>
      <label>LGA:<input type="text" id="lgaInput" readonly /></label>
      <label>STATE:<input type="text" id="stateInput" readonly /></label>
      <label
        >Is Certificate Ready?
        <select id="certificateReady">
          <option value="">-- Select --</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </label>
      <label id="evidenceLabel" class="hidden"
        >Upload Evidence:<input type="file"
      /></label>
      <button id="submitAttributes">Submit</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    <script>
      proj4.defs(
        "EPSG:26331",
        "+proj=utm +zone=31 +ellps=clrk80 +towgs84=-92,-93,122,0,0,0,0 +units=m +no_defs"
      );

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
            },
            satellite: {
              type: "raster",
              tiles: ["https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"],
              tileSize: 256,
            },
            hybrid: {
              type: "raster",
              tiles: ["https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}"],
              tileSize: 256,
            },
            terrain: {
              type: "raster",
              tiles: ["https://mt1.google.com/vt/lyrs=t&x={x}&y={y}&z={z}"],
              tileSize: 256,
            },
            roadmap: {
              type: "raster",
              tiles: ["https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}"],
              tileSize: 256,
            },
          },
          layers: [
            {
              id: "osm-base",
              type: "raster",
              source: "osm",
              layout: { visibility: "none" },
            },
            {
              id: "satellite-base",
              type: "raster",
              source: "satellite",
              layout: { visibility: "none" },
            },
            {
              id: "hybrid-base",
              type: "raster",
              source: "hybrid",
              layout: { visibility: "none" },
            },
            {
              id: "terrain-base",
              type: "raster",
              source: "terrain",
              layout: { visibility: "none" },
            },
            {
              id: "roadmap-base",
              type: "raster",
              source: "roadmap",
              layout: { visibility: "visible" },
            },
          ],
        },
        center: [3.3792, 6.5244],
        zoom: 11,
      });

      let polygonGeoJSON = { type: "FeatureCollection", features: [] };
      let pointGeoJSON = { type: "FeatureCollection", features: [] };

      map.on("load", () => {
        map.addSource("polygonLayer", {
          type: "geojson",
          data: polygonGeoJSON,
        });
        map.addLayer({
          id: "polygon-fill",
          type: "fill",
          source: "polygonLayer",
          paint: {
            "fill-color": "rgba(0,0,255,0.2)",
            "fill-outline-color": "red",
          },
        });

        map.addSource("pointLayer", { type: "geojson", data: pointGeoJSON });
        map.addLayer({
          id: "point-symbol",
          type: "circle",
          source: "pointLayer",
          paint: {
            "circle-radius": 6,
            "circle-color": "#0066ff",
            "circle-stroke-width": 2,
            "circle-stroke-color": "#ff0000",
          },
        });

        const popup = new maplibregl.Popup({
          closeButton: true,
          closeOnClick: true,
        });
        map.on("click", "point-symbol", (e) => {
          const f = e.features[0];
          popup
            .setLngLat(f.geometry.coordinates)
            .setHTML(`<strong>Pillar: </strong> ${f.properties.pillarNumber}`)
            .addTo(map);
        });
      });

      document.querySelectorAll('input[name="basemap"]').forEach((radio) => {
        radio.onchange = (e) => {
          const selected = `${e.target.value}-base`;
          const basemaps = [
            "osm-base",
            "satellite-base",
            "hybrid-base",
            "terrain-base",
            "roadmap-base",
          ];
          basemaps.forEach((id) => {
            if (map.getLayer(id)) {
              map.setLayoutProperty(
                id,
                "visibility",
                id === selected ? "visible" : "none"
              );
            }
          });
        };
      });

      const form = document.getElementById("formContainer");
      const wardInput = document.getElementById("wardInput");
      const lcdaInput = document.getElementById("lcdaInput");
      const lgaInput = document.getElementById("lgaInput");
      const stateInput = document.getElementById("stateInput");

      document
        .getElementById("csvFile")
        .addEventListener("change", async (event) => {
          const file = event.target.files[0];
          if (!file) return;

          const text = await file.text();
          const rows = text.trim().split("\n").slice(1);

          const rawPoints = rows.map((row) => {
            const [pillarNumber, easting, northing] = row.split(",");
            const [lon, lat] = proj4("EPSG:26331", "EPSG:4326", [
              parseFloat(easting),
              parseFloat(northing),
            ]);
            return {
              type: "Feature",
              geometry: { type: "Point", coordinates: [lon, lat] },
              properties: { pillarNumber: pillarNumber.trim() },
            };
          });

          pointGeoJSON = { type: "FeatureCollection", features: rawPoints };
          const coords = rawPoints.map((f) => f.geometry.coordinates);
          if (
            coords[0][0] !== coords.at(-1)[0] ||
            coords[0][1] !== coords.at(-1)[1]
          )
            coords.push(coords[0]);
          polygonGeoJSON = {
            type: "FeatureCollection",
            features: [
              {
                type: "Feature",
                geometry: { type: "Polygon", coordinates: [coords] },
                properties: {},
              },
            ],
          };

          map.getSource("pointLayer").setData(pointGeoJSON);
          map.getSource("polygonLayer").setData(polygonGeoJSON);

          map.fitBounds(turf.bbox(polygonGeoJSON), { padding: 40 });
          form.style.display = "block";

          queryAdminBoundaries(polygonGeoJSON.features[0]);
        });

      async function queryAdminBoundaries(polygonFeature) {
        try {
          const res = await fetch("http://localhost:3000/intersect", {
            // your backend endpoint
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(polygonFeature.geometry),
          });
          const data = await res.json();

          if (data.success && data.data) {
            const props = data.data;
            wardInput.value = props.wardname || "N/A";
            lcdaInput.value = props.lcdaname || "N/A";
            lgaInput.value = props.lganame || "N/A";
            stateInput.value = props.statename || "N/A";
          } else {
            wardInput.value =
              lcdaInput.value =
              lgaInput.value =
              stateInput.value =
                "N/A";
          }
        } catch (err) {
          console.error("Error querying backend:", err);
          wardInput.value =
            lcdaInput.value =
            lgaInput.value =
            stateInput.value =
              "N/A";
        }
      }
    </script>
  </body>
</html>
