<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Secondary mesh lines between satellite nodes — faint, gives it a "network" feel rather than a plain star/hub-spoke. -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round">
    <line x1="304" y1="88" x2="336" y2="234" />
    <line x1="336" y1="234" x2="146" y2="322" />
    <line x1="146" y1="322" x2="64" y2="156" />
    <line x1="64" y1="156" x2="304" y2="88" />
  </g>

  <!-- Primary connections — TwoNode hub to each platform node. -->
  <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="176" x2="304" y2="88" />
    <line x1="200" y1="176" x2="336" y2="234" />
    <line x1="200" y1="176" x2="146" y2="322" />
    <line x1="200" y1="176" x2="64" y2="156" />
  </g>

  <!-- Satellite nodes — the three platforms (+ one open slot for what's next). -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <rect x="292" y="76" width="24" height="24" rx="4" />
    <rect x="324" y="222" width="24" height="24" rx="4" />
    <rect x="134" y="310" width="24" height="24" rx="4" />
    <rect x="52" y="144" width="24" height="24" rx="4" />
  </g>

  <!-- TwoNode hub — the brand's own two-squares-and-a-line mark, scaled up as the center of the network. -->
  <g fill="#FFFFFF">
    <rect x="186" y="146" width="30" height="30" rx="5" />
    <rect x="140" y="222" width="18" height="18" rx="3" fill-opacity="0.85" />
    <line x1="196" y1="184" x2="158" y2="222" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
