name: Check migrations against staging

# Read-only safety net: on any PR into dev, main or prod that touches
# migrations or the schema, verify the migration history actually applies
# cleanly to twonode_staging (catches drift/conflicts before merge, before the
# staging auto-deploy or a manual prod run ever sees it). Never writes to
# any database. dev is included because it's now where feature branches
# land first (main is updated from dev, not directly).
on:
  pull_request:
    branches: [dev, main, prod]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: prisma validate
        # Doesn't connect to a database, but prisma.config.ts's datasource
        # block reads DATABASE_URL unconditionally at config-load time (via
        # env()), so even schema-only validation fails without it set —
        # confirmed live: "PrismaConfigEnvError: Missing required
        # environment variable: DATABASE_URL". Same secret as the diff step
        # below; validate never sends it anywhere.
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Diff staging (twonode_staging) against this branch's schema
        run: |
          echo "Pending schema diff for twonode_staging (informational — does not fail the build):"
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema \
            --script || true
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
