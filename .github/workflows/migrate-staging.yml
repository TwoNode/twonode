name: Deploy migrations to staging

# main is the staging branch — every push that touches prisma/migrations
# applies pending migrations to staging (<staging-db>) automatically. Low risk: staging is
# an isolated database, never the database real users hit.
on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema/**"

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: prisma migrate status
        if: always()
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
